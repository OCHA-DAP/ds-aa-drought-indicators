name: Deploy pages site to GitHub Pages

# Publishes pages/ as-is (landing page + one page per country), team landing-page convention.
# No build step here: pages are regenerated locally by scripts/make_site.py and committed.
on:
  push:
    branches: [main]
    paths: ["pages/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site && rsync -a --exclude '_*.html' pages/ site/
          test -f site/index.html && test -f site/assets/page.css
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
